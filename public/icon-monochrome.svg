<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <!-- Silhouette des notifications Android : raquette + balle (balle à droite, comme sur le logo), BLANC sur fond TRANSPARENT.
       Android n'affiche dans la barre d'état que la transparence de l'icône : le logo couleur
       sur fond blanc y devenait un carré blanc. Source des PNG icon-monochrome-*.png. -->
  <defs>
    <clipPath id="tete">
      <ellipse cx="48" cy="29" rx="15" ry="21"/>
    </clipPath>
  </defs>
  <g transform="translate(-9 3) rotate(38 48 50)" fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round">
    <g clip-path="url(#tete)" stroke-width="2.6">
      <path d="M41 4 V56 M48 4 V56 M55 4 V56 M28 21 H68 M28 29 H68 M28 37 H68"/>
    </g>
    <ellipse cx="48" cy="29" rx="17" ry="23" stroke-width="6"/>
    <path d="M38 47 L48 62 L58 47" stroke-width="5"/>
    <path d="M48 62 V91" stroke-width="9"/>
  </g>
  <circle cx="84" cy="54" r="9" fill="#fff"/>
</svg>
