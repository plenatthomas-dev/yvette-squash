# Mises à jour des dépendances (audit 2026-10, point 31). Une PR par semaine et par
# écosystème, regroupée pour ne pas noyer la file : les correctifs de sécurité, eux, arrivent
# dès qu'ils sont publiés (Dependabot les ouvre hors calendrier). Chaque PR passe la CI.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      # Les montées de version mineures et correctives d'un coup ; les majeures à part,
      # une par une — c'est là que les ruptures se cachent (cf. le passage à Next 16).
      mineures:
        update-types: [minor, patch]
    ignore:
      # Les types de Node suivent le RUNTIME (engines : 24.x), pas la dernière version :
      # des types plus récents laisseraient passer des API absentes en production.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # TypeScript 7 : majeure à planifier à la main — typescript-eslint (via
      # eslint-config-next) ne le prend pas encore (octobre 2026).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
